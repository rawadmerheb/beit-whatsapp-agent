# Render Blueprint -- lets Render auto-configure this service when you
# connect the repo, instead of filling in every field by hand.
# Docs: https://render.com/docs/blueprint-spec
#
# What to do with this file: nothing -- just push it to GitHub along with
# the rest of the project, then in Render: New + -> Blueprint -> pick this
# repo. Render reads this file and pre-fills everything except the three
# secrets below (marked `sync: false`), which it will prompt you to type in
# during setup -- they never need to live in the repo itself.
services:
  - name: beit-whatsapp-agent
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
